# 网关对外端口：前端所有请求只打这里（L7）
server:
  port: 9000

spring:
  application:
    # 服务名：注册到 Nacos 的名字
    name: gateway-service
  data:
    redis:
      # 网关限流的令牌桶存在 Redis（L7-4），与商品服务的缓存共用一个 Redis
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        # 注册中心地址：Nacos 服务端 8848（3.x 的 8080 只是控制台）
        server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          # 全局跨域（L7-5）：前端只打 9000，跨域响应头由网关统一加
          globalcors:
            # 预检请求 OPTIONS 即使没匹配到路由也交给 CORS 处理器
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                # 本地学习放开所有来源；生产改成具体前端域名
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          # 路由三要素：id（路由名）、uri（转发目标）、predicates（什么请求走这条路由）
          # lb://服务名：交给 LoadBalancer 从 Nacos 取实例地址，不写死 IP
          # StripPrefix=1：去掉路径第一段 /api，再转发给下游
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/user/**
              filters:
                - StripPrefix=1
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/product/**
              filters:
                - StripPrefix=1
                # 令牌桶限流：登录用户按 userId 分桶，未登录按 IP（见 RateLimitConfig）
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    # 每秒补 2 个令牌，最多攒 5 个（演示值，生产按接口容量调）
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1

# 网关验签（L7-2）：只填公钥端点，网关不存私钥、只验签
mall:
  jwt:
    jwks-uri: http://localhost:8081/auth/jwks
