# 服务端口：每个微服务占用独立端口（user=8081 product=8082 order=8083 gateway=9000）
server:
  port: 8083

spring:
  application:
    # 服务名：注册到 Nacos 时用这个名字被别人发现（阶段3生效）
    name: order-service
  cloud:
    nacos:
      discovery:
        # 注册中心地址：Nacos 服务端是 8848（3.x 的 8080 只是控制台，别填错）
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        # Sentinel 控制台地址（本机 8858，避开 Nacos 控制台的 8080）
        dashboard: 127.0.0.1:8858
        # 本服务与控制台通信的端口；三服务同机时框架自动顺延 8720/8721
        port: 8719
    # Feign 超时：与 L2 的 RestTemplate 保持一致（3 秒），下游卡住时快速失败
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 3000
  data:
    redis:
      # 号段发号器（L9-3）与商品缓存共用本机 Redis
      host: 127.0.0.1
      port: 6379
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  devtools:
    restart:
      # 热部署开关，生产环境打包时该依赖自动失效
      enabled: true

mybatis:
  configuration:
    # 驼峰映射：数据库 create_time 自动映射实体 createTime
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打到控制台，方便看 MyBatis 到底执行了什么
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# L9-1：线程池参数。验收反压时可临时把 remote 的 queue 调成 1，测完改回。
# 在线池宁可拒绝（4291），补偿池用 CallerRunsPolicy 不丢任务。
mall:
  order:
    # 号段大小：一次从 Redis 领 step 个号，本地慢慢发；验收时可调成 3 观察换段
    segment:
      step: 1000
    pool:
      remote:
        core: 8
        max: 16
        queue: 64
      compensate:
        core: 1
        max: 2
        queue: 32
    # L9 补丁2：库存补偿任务。落库后定时扫描，失败按指数退避重试，次数耗尽转人工。
    compensate:
      # 每轮扫描间隔（上一轮跑完后计时），默认 10 秒
      scan-delay-ms: 10000
      # 一轮最多处理多少条，避免一次扫太多拖住调度线程
      batch-size: 20
      # 最大重试次数，达到后状态置 MANUAL
      max-retry: 5
      # 退避基数：10s、20s、40s、80s
      backoff-base-ms: 10000
