# 服务端口：每个微服务占用独立端口（user=8081 product=8082 order=8083 gateway=9000）
server:
  port: 8081

spring:
  application:
    # 服务名：注册到 Nacos 时用这个名字被别人发现（阶段3生效）
    name: user-service
  cloud:
    nacos:
      discovery:
        # 注册中心地址：Nacos 服务端是 8848（3.x 的 8080 只是控制台，别填错）
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        # Sentinel 控制台地址（本机 8858，避开 Nacos 控制台的 8080）
        dashboard: 127.0.0.1:8858
        # 本服务与控制台通信的端口；三服务同机时框架自动顺延 8720/8721
        port: 8719
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # serverTimezone 必须指定，否则 8.x/9.x 驱动连接时会有时区问题
    url: jdbc:mysql://localhost:3306/db_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  devtools:
    restart:
      # 热部署开关，生产环境打包时该依赖自动失效
      enabled: true

# JWT（L6）：私钥只在 user 服务，其他服务通过 GET /auth/jwks 取公钥验签
# kid 是密钥编号，换密钥时改它，验签方按 kid 选公钥
mall:
  jwt:
    kid: mall-l6-dev
    private-key: classpath:keys/jwt-private.pem
    public-key: classpath:keys/jwt-public.pem
    # token 有效期（秒）：2 小时。太短用户频繁重登，太长泄露后风险窗口大
    ttl-seconds: 7200
    # 本服务 /user/** 的拦截器也用它验签（指向自己的 JWKS 端点）
    jwks-uri: http://localhost:8081/auth/jwks

mybatis:
  configuration:
    # 驼峰映射：数据库 create_time 自动映射实体 createTime
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打到控制台，方便看 MyBatis 到底执行了什么
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
